<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operační schopnosti | MZS</title>
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" sizes="180x180" href="/icon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/icon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/icon/favicon-16x16.png">
    <link rel="manifest" href="/icon/site.webmanifest">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div id="site-header"></div>
    <script src="../js/header.js"></script>
    <main class="stranka operacni-schopnosti">
        <section class="operacni-blok">
            <div class="operacni-blok__obsah">
                <h2>Zdravotnická a přednemocniční péče v krizových podmínkách</h2>
            </div>
            <div class="operacni-blok__obrazek">
                <img src="images/PrednemocnicniPece.webp" alt="Přednemocniční péče">
            </div>
        </section>
        <section class="operacni-blok">
            <div class="operacni-blok__obsah">
                <h2>Vyhleávání a vyprošťování osob v extrémním a obtížně přítupném terénu</h2>
            </div>
            <div class="operacni-blok__obrazek" role="img" aria-label="Obrázek k bloku 2"></div>
        </section>
        <section class="operacni-blok">
            <div class="operacni-blok__obsah">
                <h2>Podpora evakuačních a humanitárních operací</h2>
            </div>
            <div class="operacni-blok__obrazek" role="img" aria-label="Obrázek k bloku 3"></div>
        </section>
        <section class="operacni-blok">
            <div class="operacni-blok__obsah">
                <h2>Zdravotnické a logistické zabezpečení v odlehlých lokalitách</h2>
            </div>
            <div class="operacni-blok__obrazek" role="img" aria-label="Obrázek k bloku 4">
                <img src="images/ZabezpeceniVOdlehlychLokalitach.webp" alt="Zabezpečení odlehlé lokality">
            </div>
        </section>
    </main>
</body>
</html>
